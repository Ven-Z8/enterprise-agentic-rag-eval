[project]
name = "eval-harness"
version = "0.2.0"
description = "Domain-Adaptive Agent Evaluation Harness (Proving Ground): audited golden sets, two-tier scoring, calibrated LLM-judge, regression diffs."
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.2.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
eval-harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Classic ruff default set, pinned explicitly so results are stable across
# ruff versions (0.16 widened its implicit defaults).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
