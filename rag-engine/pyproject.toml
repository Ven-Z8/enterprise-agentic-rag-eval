[project]
name = "ragfilings"
version = "0.1.0"
description = "Production RAG over messy SEC 10-K filings, with a published failure analysis. Evaluated by the sibling eval-harness."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "lxml>=5.0",
    "networkx>=3.4",
    "numpy>=2.4.6",
    "openai>=2.44.0",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.52.4",
]


[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ragfilings = "ragfilings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragfilings"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]
